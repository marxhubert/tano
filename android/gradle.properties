org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dnode.native.access=allow
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Désactivation temporaire des nouveautés AGP 9 pour la compatibilité des plugins Flutter
android.builtInKotlin=false
android.newDsl=false

# Supprimer les warnings sur les versions Java obsolètes (8/11) des plugins
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Utilisation du JDK 21 pour le build (plus stable que le 26 pour Android actuellement)
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
