name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  ci:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        # The golden tests compare pixels and depend on how the host rasterises
        # text: they are generated and reviewed locally, never here.
        run: flutter test --exclude-tags golden
