name: tano
description: TanoNote - Notes, tasks and projects manager.
publish_to: 'none'
version: 0.8.4-beta

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  package_info_plus: ^8.0.0
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.2

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.png"

flutter:
  uses-material-design: true
