name: tano
description: TanoNote - Notes, tasks and projects manager.
publish_to: 'none'
version: 1.0.0-beta

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  sentry_flutter: ^9.30.0
  flutter:
    sdk: flutter

  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  package_info_plus: ^10.2.1
  material_symbols_icons: ^4.2960.0
  url_launcher: ^6.3.2
  # Play In-App Updates, Android only: the store owns the update, we just ask.
  in_app_update: ^5.0.0
  path: ^1.9.0
  get_it: ^8.0.3
  uuid: ^4.5.1
  file_picker: ^12.2.0
  open_filex: ^4.7.0
  local_auth: ^3.0.2
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.1.0
  cryptography: ^2.9.0
  archive: ^4.2.0

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  path_provider_platform_interface: ^2.1.2
  sqflite_common_ffi: ^2.3.0

# Native splash screen (Android + iOS), generated with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # Colors.blueGrey.shade50 (light) / Colors.blueGrey.shade900 (dark), the
  # same surfaces the in-app splash uses.
  color: "#ECEFF1"
  color_dark: "#263238"
  # Logo matching the in-app splash: black87 circle + white bookmark.
  # The main images are full-screen composites (logo + text) for pixel-perfect
  # matching on iOS and pre-Android-12.
  image: assets/splash_logo.png
  image_dark: assets/splash_logo_dark.png
  android_12:
    color: "#ECEFF1"
    color_dark: "#263238"
    # Android 12+ uses a separate icon (circle only) and branding (text only).
    image: assets/splash_logo_android12.png
    branding: assets/splash_branding.png
    branding_dark: assets/splash_branding_dark.png
  web: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/config/malagasy_refs.json
    - assets/licenses/
    - assets/icons/Ghozi_Muhtarom/

# Sentry dart plugin: uploads the debug symbols so that release stack traces
# stay readable. Needs SENTRY_AUTH_TOKEN (or sentry.properties, git-ignored)
# and only runs on a release build.
sentry:
  upload_debug_symbols: true
  # Web only; TanoNote ships on Android and iOS.
  upload_source_maps: false
  # Supply SENTRY_PROJECT and SENTRY_ORG in the release environment.
